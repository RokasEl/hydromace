[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromace"
version = "0.2"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    {name = "Rokas Elijošius", email = "re344@cam.ac.uk"}
]
dependencies = [
    "mace-torch==0.3.16",
    "typer==0.27.2",
    "e3nn==0.4.4",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydromace"]
